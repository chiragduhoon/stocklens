name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (offline demo data)
    runs-on: ubuntu-latest
    env:
      STOCKLENS_DATA: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pandas
      - run: pytest -q

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
